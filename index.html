<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <!--
    A-173, zweite Verteidigungslinie (B3 einer Sicherheitsprüfung): kein
    Text aus dem Spielstand soll je durch innerHTML gehen, aber diese Zeile
    begrenzt den Schaden, falls doch eine Stelle übersehen wird. GitHub
    Pages lässt sich keine eigene Antwortkopfzeile setzen -- das `meta`-
    Element ist hier der einzige verfügbare Hebel.

    `script-src 'self'` ist der Riegel, auf den es ankommt: er blockiert
    eingeschleustes `onerror=`/`onclick=` und jedes nachgeladene Skript.
    `style-src 'self' 'unsafe-inline'` ist NICHT verhandelbar -- das Spiel
    schreibt `style`-Attribute in seine Vorlagen (u. a. Balken/Anteile in
    ui.js und aufholen.js). Das ist harmlos, `script-src` bleibt scharf.
    `connect-src 'none'` schneidet zusätzlich jeden Abfluss ab -- das Spiel
    stellt ohnehin keine Netzanfrage (nachgesehen).

    Selbst nachgemessen, nicht dem Bericht geglaubt (Definition von fertig
    3): alle neun Bereiche + Kachel-Wächter 6/6 grün + Konsole ohne
    blockierte Anfragen unter genau dieser Richtlinie, siehe A-173-Ergebnis.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entropy</title>
  <link rel="stylesheet" href="css/style.css?v=0.9.1" />
</head>
<body>
  <!--
    Festes Regionen-Layout. Grundregel: Dinge dürfen dazukommen, aber nie
    ihren Platz wechseln -- nur so entsteht Muskelgedächtnis.

      Kopf         Titel, aktiver Planet, Testmodus
      Ressourcen   waagerechte Leiste (viel Platz in der Breite)
      Navigation   links, feste Reihenfolge
      Spielfeld    Mitte, hier passiert das Spiel
      Status       rechts, laufende Aufträge + Log

    Die Seite selbst scrollt nie. Wird ein einzelner Bereich zu lang
    (Galaxieliste), scrollt nur dieser intern.
  -->
  <div class="rahmen">

    <header class="kopf">
      <h1>ENTROPY <span class="version" id="version"></span></h1>
      <!-- Die Uhr der Demo. Steht im Kopf und ist IMMER sichtbar: sie ist die
           einzige Zahl, unter der jede andere Entscheidung im Spiel steht.

           DAS GERÜST STEHT HIER UND NICHT IN ui.js, und das ist Prinzip 8a in
           seiner einfachsten Form: die Uhr läuft jede Sekunde weiter. Würde
           renderSupernova ihren Inhalt neu bauen, wären ihre Elemente jede
           Sekunde andere -- harmlos, solange nichts darin anklickbar ist, aber
           genau so fängt jede der fünf offenen Stellen an. Hier entstehen die
           Felder EINMAL, und die Anzeige füllt danach nur noch Text und
           Balkenbreite nach.

           Tobis Befund beim ersten eigenen Spielen (16.08.2026): "Der
           Countdown zur Supanova muss bisschen Auffälliger designed sein." Er
           war eine Statuszeile in Fließtext; jetzt trägt er eine Marke, eine
           große Zahl, den Grund daneben und einen Balken, der zeigt, wieviel
           von der Frist schon weg ist. -->
      <!-- Ingame-Datum (A-005). Steht NEBEN der Supernova-Uhr und nicht in
           ihr: die Uhr verschwindet, wenn es keine Frist gibt, das Datum
           läuft immer. Feste Breite über tabular-nums im CSS, sonst
           zappelt der Kopf im Sekundentakt. -->
      <div class="spiel-datum" id="spiel-datum" title=""></div>
      <div class="supernova-uhr" id="supernova-uhr" hidden>
        <span class="uhr-marke" id="uhr-marke"></span>
        <div class="uhr-koerper">
          <div class="uhr-zeile">
            <span class="uhr-zeit" id="uhr-zeit"></span>
            <span class="uhr-was" id="uhr-was"></span>
          </div>
          <div class="uhr-schiene"><div class="uhr-fuellung" id="uhr-fuellung"></div></div>
        </div>
      </div>
      <div class="kopf-planet">
        <span id="planet-name"></span>
        <span id="planet-koordinaten" class="dezent"></span>
      </div>
      <div class="kopf-planetenwahl" id="planeten-leiste"></div>
      <!-- Feedback-Verweis (A-018). Fester Platz, unaufdringlich: ein Link,
           kein Knopf -- er konkurriert damit optisch nicht mit den
           Spielaktionen (Prinzip 8). Das Ziel (ein vorbefülltes GitHub-Formular
           samt Versionsnummer) setzt js/ui.js, weil es von der Sprache und der
           laufenden Version abhängt; hier steht nur die Hülle, damit sie nie
           neu entsteht und nie einen Klick verliert (Prinzip 8a). -->
      <a class="kopf-feedback" id="feedback-link" href="https://github.com/Mahola2033/entropy-demo/issues/new"
         target="_blank" rel="noopener noreferrer" data-text="Feedback"></a>
      <!-- Das Zahnrad (A-140, R-24). Ersetzt die Sprachleiste, die bis hierhin
           an dieser Stelle stand -- sie zieht vollständig ins Einstellungs-
           fenster (weiter unten, #einstellungen) um. Ein Symbol statt einer
           ganzen Leiste macht den Kopf dadurch NETTO SCHMALER, nicht breiter:
           genau der Grund, warum R-24 diesen Weg und keinen der beiden anderen
           entschieden hat. Der erweiterbare Ort dahinter nimmt jede künftige
           Einstellung auf, ohne dass die Frage "wo gehört das hin" erneut
           gestellt werden muss. Das Symbol selbst setzt js/ui.js aus der
           Symboltabelle (Prinzip 9) -- kein Emoji-Literal hier. -->
      <button class="kopf-einstellungen" id="einstellungen-knopf" data-titel="Einstellungen"></button>
      <!-- data-text: feste Beschriftung, die js/ui.js beim Zeichnen durch t()
           schickt. Der deutsche Text im Attribut IST der Übersetzungsschlüssel,
           genau wie im Quelltext -- siehe js/sprache.js. -->
      <div class="kopf-testmodus" id="testmodus-leiste">
        <span class="testmodus-label" data-text="Testmodus"></span>
        <button data-sprung-sek="10">+10s</button>
        <button data-sprung-sek="60">+1m</button>
        <button data-sprung-sek="600">+10m</button>
        <button data-sprung-sek="3600">+1h</button>
        <!-- Der +1-Tag-Sprung steht hier BEWUSST NICHT (A-058, Tobis
             Entscheidung 18.08.: „der ist einfach zu viel des Guten").
             js/testmodus.js baut ihn nur im Entwicklungsstand -- ein Knopf,
             der bloß per CSS versteckt wäre, bliebe über die Konsole
             klickbar. -->
        <!-- A-038: Dauerfaktor statt Sprung. 0 ist die Pause -- derselbe
             Regler, ein Wert weiter unten, kein zweiter Mechanismus. -->
        <button data-zeitfaktor="0" data-text="Pause"></button>
        <button data-zeitfaktor="1">×1</button>
        <button data-zeitfaktor="2">×2</button>
        <button data-zeitfaktor="3">×3</button>
        <button data-zeitfaktor="4">×4</button>
        <button id="testmodus-reset" class="testmodus-reset">Reset</button>
      </div>
    </header>

    <!-- Wird vollständig aus den Ressourcen-Definitionen erzeugt (js/ui.js). -->
    <section class="ressourcenleiste" id="ressourcen-leiste"></section>

    <nav class="navigation" id="navigation"></nav>

    <main class="spielfeld" id="spielfeld">
      <section class="bereich" data-bereich="planet">
        <!-- A-064: „Diese Welt in Zahlen" -- fester Block ÜBER den
             Gebäudegruppen, kein eigener Tab. Die Hülle steht hier, damit
             sie nie neu entsteht; die fünf Gruppen baut js/ui.js einmalig
             und füllt sie danach nur noch (Prinzip 8a). -->
        <h2 data-text="Diese Welt in Zahlen"></h2>
        <div id="planet-uebersicht" class="uebersicht"></div>
        <!-- A-146: Sammelwort fuer den Spieler ist "Anlagen & Sektoren"
             (Tobi, 24.08.). BEWUSST ein rohes & im Attribut, nicht &amp;:
             renderFesteTexte (js/ui.js) liest data-text ueber .textContent,
             kein innerHTML -- ein rohes & ist hier sicher. Wichtiger: der
             Regeltest (tests/sprache.test.js, "jede feste Beschriftung")
             liest diese Datei als reinen Text OHNE Entity-Dekodierung; ein
             &amp; hier wuerde als ANDERER Schluessel geprueft als der, den
             der Browser zur Laufzeit aus data-text liest (der dekodiert).
             Erst mit dem rohen & stimmen Test-Schluessel und Laufzeit-
             Schluessel ueberein (gemessen: mit &amp; schlug
             sprache.test.js:147 fehl, siehe Ergebnis A-146). -->
        <h2 data-text="Anlagen & Sektoren"></h2>
        <ul id="gebaeude-liste" class="kachel-raster"></ul>
        <div id="gebaeude-warteschlange" class="warteschlange"></div>
      </section>

      <!-- A-153: der Lager-Bereich, Block 1 (Bestände). Position 2, direkt
           über Forschung (Tobis Entscheidung, 23.08. -- siehe der Kommentar
           an BEREICHE in js/ui.js). Übernimmt die Verarbeitungs-Reserve, die
           bis hierhin im Planet-Bereich stand (#verarbeitung-block, jetzt
           entfernt) -- EIN Ort für alle drei Bestands-Stellschrauben statt
           verteilter Orte. -->
      <section class="bereich" data-bereich="lager" hidden>
        <h2 data-text="Lager"></h2>
        <div id="lager-block"></div>
      </section>

      <!-- A-144: Die Forschungs-Warteschlange stand hier bis v0.4.4 als
           #forschung-warteschlange, rund 1.500 px tief im Baum-Layout
           (KONZEPT-LAGER E10) -- bei Klaus' 520 px Fensterhöhe über tausend
           Pixel Scrollweg, praktisch unerreichbar. Sie ist jetzt Teil der
           Statusspalte (renderStatus, #status-forschung-warteschlange). -->
      <section class="bereich" data-bereich="forschung" hidden>
        <h2><span data-text="Forschung"></span> <span class="dezent" id="forschung-info"></span></h2>
        <ul id="forschung-liste" class="kachel-raster baum"></ul>
      </section>

      <section class="bereich" data-bereich="werft" hidden>
        <h2><span data-text="Werft"></span> <span class="dezent" id="werft-info"></span></h2>
        <ul id="werft-liste" class="kachel-raster"></ul>
        <div id="werft-warteschlange" class="warteschlange"></div>

        <!-- A-204: Abwehrstellungen laufen über denselben Werft-Weg (Stückzahl,
             Warteschlange), landen aber als Bestand am Planeten statt in einer
             Flotte -- deshalb hier, als zweite Liste in derselben Werft-Ansicht,
             nicht als eigener Reiter. -->
        <h2><span data-text="Verteidigung"></span> <span class="dezent" id="abwehr-info"></span></h2>
        <ul id="abwehr-liste" class="kachel-raster"></ul>
        <div id="abwehr-warteschlange" class="warteschlange"></div>
      </section>

      <section class="bereich" data-bereich="flotten" hidden>
        <h2 data-text="Flotten"></h2>
        <div id="flotten-block"></div>
      </section>

      <section class="bereich bereich-voll" data-bereich="galaxie" hidden>
        <h2><span data-text="Galaxie"></span> <span class="dezent" id="galaxie-info"></span></h2>
        <!-- DREI Spalten seit A-057: Galaxie, System, Kommando. Die dritte ist
             Tobis Ein-Screen-Vorgabe („Alles was man zum Bewegen der Flotte
             braucht muss auf einem Screen zu sehen sein") -- sie steht FEST
             daneben und klappt nicht, damit der Weg Flotte → Ziel → Auftrag
             immer derselbe ist (Prinzip 8). -->
        <div class="drei-spalten">
          <!-- Alle Spalten haben einen gleich hohen Kopfbereich (.spalte-kopf),
               damit die Listen auf derselben Linie beginnen. Sonst schiebt die
               Flotten-Zeile rechts die Liste nach unten. -->
          <div class="spalte">
            <div class="spalte-kopf">
              <h3 class="unter-titel" data-text="Systeme"></h3>
              <div id="galaxie-hinweis" class="sonden-status"></div>
            </div>
            <!--
              Die Galaxiekarte. Sie ERSETZT die Liste darunter nicht, sie zeigt
              denselben Bestand von oben: die Liste nennt die nächsten 25
              Systeme, die Karte zeigt alle 500 und wo sie zueinander liegen.
              Beide führen über denselben Weg ins Spiel (systemAnzeigen in
              js/ui.js).

              Leer im Markup: Inhalt und Klickziele entstehen EINMAL in
              js/karte.js und bleiben danach stehen -- 500 Sterne pro Sekunde
              neu zu zeichnen wäre genau der Klickfresser aus Prinzip 8a.
            -->
            <!-- Die Hülle trägt die Zoomknöpfe (A-039). Sie stehen an einer
                 festen Stelle über der Karte, damit sie beim Zoomen nicht
                 mitwandern (Prinzip 8) -- gebaut werden sie EINMAL in
                 js/karte.js, nicht in jedem Takt. -->
            <div class="karte-huelle">
              <svg id="galaxie-karte" class="karte" viewBox="-104 -104 208 208"
                   preserveAspectRatio="xMidYMid meet" role="img"></svg>
            </div>
            <div id="galaxie-legende" class="karte-legende"></div>
            <div class="spalte-scrollt">
              <ul id="galaxie-liste" class="system-liste"></ul>
            </div>
          </div>
          <div class="spalte">
            <div class="spalte-kopf">
              <h3 class="unter-titel"><span id="system-titel"></span> <span class="dezent" data-text="– Systemkarte"></span> <span id="system-stern" class="stern-tag"></span></h3>
              <div id="sonden-status" class="sonden-status"></div>
              <div id="system-flotten" class="sonden-status"></div>
            </div>
            <!-- Dasselbe eine Ebene tiefer: der Stern in der Mitte, die
                 Orbits als Ringe, und darauf die Objekte und jede Flotte, die
                 gerade hier steht oder hereinkommt. Ein Klick hebt den Orbit
                 hervor und holt seine Zeile in der Liste in den Blick. -->
            <div class="karte-huelle">
              <svg id="system-karte" class="karte" viewBox="-104 -104 208 208"
                   preserveAspectRatio="xMidYMid meet" role="img"></svg>
            </div>
            <div class="spalte-scrollt">
              <ul id="system-liste" class="system-liste"></ul>
            </div>
          </div>
          <!-- Die Kommandoleiste (A-057). Drei Stationen von oben nach unten,
               immer sichtbar. Leer im Markup: das Gerüst entsteht EINMAL in
               js/ui.js und bleibt danach stehen (Prinzip 8a) -- ein Los-Knopf,
               der jede Sekunde neu entsteht, verschluckt Klicks. -->
          <div class="spalte">
            <div class="spalte-kopf">
              <h3 class="unter-titel" data-text="Kommando"></h3>
              <div id="kommando-hinweis" class="sonden-status"></div>
            </div>
            <div class="spalte-scrollt">
              <div id="kommando-leiste"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="bereich" data-bereich="imperium" hidden>
        <h2><span data-text="Imperium"></span> <span class="dezent" id="imperium-info"></span></h2>
        <div id="imperium-block" class="tabelle-scrollt"></div>
      </section>

      <section class="bereich" data-bereich="handel" hidden>
        <h2><span data-text="Handel"></span> <span class="dezent" id="markt-titel"></span></h2>
        <div id="markt-block"></div>
        <h2 data-text="Logistiknetz"></h2>
        <div id="logistiknetz-block"></div>
      </section>

      <!-- Das Handbuch. Tobis Vorgabe zum Ersteinstieg: Führung anbieten,
           aber durch Erklärung, wie das Spiel funktioniert -- keine
           Schritt-für-Schritt-Anleitung, und jederzeit abrufbar. Der Inhalt
           steht in js/handbuch.js, damit er übersetzbar bleibt und nicht im
           Markup festwächst. -->
      <section class="bereich" data-bereich="handbuch" hidden>
        <h2 data-text="Handbuch"></h2>
        <div id="handbuch-block" class="handbuch"></div>
      </section>

      <!-- Der Kanal zwischen Testern und Entwicklung (A-054). Drei
           Abschnitte in fester Reihenfolge: was sich geändert hat, was
           geplant ist, und der Weg zurück.

           Leer im Markup: der Inhalt entsteht EINMAL beim ersten Öffnen
           (js/ui.js). Langer Text im Sekundentakt neu zu bauen wäre der
           teuerste Weg, nichts zu ändern. -->
      <section class="bereich" data-bereich="development" hidden>
        <h2 data-text="Development"></h2>
        <div id="development-block" class="handbuch"></div>
      </section>
    </main>

    <!--
      Standardmäßig eingeklappt: die laufenden Aufträge sieht man auch an
      den Punkten in der Navigation, der volle Platz gehört dem Spielfeld.
      Ein- und Ausklappen ist eine bewusste Entscheidung des Spielers und
      bleibt bestehen -- nichts klappt von selbst auf oder zu.
    -->
    <aside class="statusspalte eingeklappt" id="statusspalte">
      <button class="statusspalte-griff" id="statusspalte-griff" data-titel="Statusspalte ein-/ausklappen"></button>
      <div class="statusspalte-inhalt">
        <!-- A-144: Tobis Befund (KONZEPT-LAGER E10) -- "die Status Spalte
             ist schon die bessere Warteschlange... man muss es nur abtrennen
             und umbennen". Aus dem einen #status-block (früher: EINE Zeile je
             Kategorie) werden drei benannte Abschnitte mit je eigenem Deckel;
             jeder zeigt den laufenden Kopf UND die volle Warteschlange
             dahinter (renderStatus/renderWarteschlange, js/ui.js). AUSDRÜCKLICH
             EIN VERSUCH mit drei Abschnitten (Tobis Wortlaut: "Wir probieren
             es mal mit drei."), keine Festlegung -- siehe Ergebnis A-144.

             A-180: Nur der laufende Auftrag (Kopf) steht fest. Die Warteliste
             dahinter (.ws-mini) bekommt einen eigenen Griff -- dieselbe
             Bauform wie .res-bestand-griff (A-162) -- und ist zugeklappt die
             Vorgabe. "Statisch" heißt weiterhin: die Höhe springt nicht
             (Tobis Entscheidung, 25.08.) -- WEDER durchs Einreihen/
             Fertigwerden/Abbrechen NOCH von selbst; nur der Griff, eine
             Spielerhandlung, darf sie ändern. -->
        <h2 data-text="Warteschlange"></h2>

        <div class="ws-abschnitt" data-ws="bau">
          <div class="ws-deckel-zeile">
            <h3 class="ws-deckel" data-text="Bau"></h3>
            <button class="res-bestand-griff" id="ws-bau-griff"></button>
          </div>
          <div id="status-bau-kopf"></div>
          <div class="ws-mini" id="status-bau-warteschlange"></div>
        </div>
        <div class="ws-abschnitt" data-ws="forschung">
          <div class="ws-deckel-zeile">
            <h3 class="ws-deckel" data-text="Forschung"></h3>
            <button class="res-bestand-griff" id="ws-forschung-griff"></button>
          </div>
          <div id="status-forschung-kopf"></div>
          <div class="ws-mini" id="status-forschung-warteschlange"></div>
        </div>
        <div class="ws-abschnitt" data-ws="werft">
          <div class="ws-deckel-zeile">
            <h3 class="ws-deckel" data-text="Werft"></h3>
            <button class="res-bestand-griff" id="ws-werft-griff"></button>
          </div>
          <div id="status-werft-kopf"></div>
          <div class="ws-mini" id="status-werft-warteschlange"></div>
        </div>

        <!-- Rest-Statusblock: was A-144 abtrennte, blieb hier übrig --
             Flottenbewegung (Gefecht, Abschnitt) und Logistiktransfers. Kein
             Bauauftrag, passt in keinen der drei Deckel (Deutung der Planung,
             siehe A-144-Auftrag). -->
        <div id="status-block" class="status-block"></div>

        <!-- Kopfzeile der Meldungen mit den beiden Umschaltern. Die Knöpfe
             stehen AUSSERHALB der Liste, und das ist kein Layoutgeschmack: die
             Liste wird im Sekundentakt neu befüllt, ein Knopf darin verlöre
             nach Prinzip 8a regelmäßig seinen Klick. Hier stehen sie im festen
             Markup und werden nie ersetzt.

             Warum es den Filter gibt -- Tobi beim ersten eigenen Spielen
             (16.08.2026): "log ist grade gut für debugging, grausam für
             spieler. Man sieht alles im ganzen Universum passieren."

             Der Griff daneben ist neu (A-144): dieselbe Notbremse wie beim
             Statusspalten-Griff, weil die drei neuen Abschnitte darüber die
             Resthöhe der Meldungen drücken (E10/E14) -- hier klappt man sie
             im Ernstfall selbst weg. Anders als der Statusspalten-Griff liegt
             der Zustand im SPIELSTAND (state.meldungenZu), nicht nur in der
             Sitzung -- Save-Kategorie 1, `|| false`-Muster wie state.logAlles. -->
        <div class="meldungen-kopf">
          <h2 data-text="Meldungen" data-titel="Was hier steht, betrifft dich – neue Anlagen, Ankünfte, Warnungen. Nichts ist damit weg, nur nicht mehr aktuell."></h2>
          <button id="meldungen-filter" class="meldungen-filter"></button>
          <button id="meldungen-griff" class="meldungen-griff" data-titel="Meldungsliste ein-/ausklappen"></button>
        </div>
        <ul id="meldungen-liste" class="meldungen-liste"></ul>
      </div>
    </aside>

  </div>

  <!-- Der Abspann. Liegt ÜBER allem, weil danach nichts mehr zu tun ist --
       die Teilchenflut hat den harten Schnitt gesetzt. Er ist kein Dialog,
       den man wegklickt: er ist das Ende. -->
  <div class="abspann" id="abspann" hidden></div>

  <!-- Das Erklärfenster beim allerersten Start. Anlass ist Tobis Notiz vom
       ersten eigenen Spielen der veröffentlichten Demo (16.08.2026): "Es kommt
       kein Fenster das irgendwas erklärt."

       Das Handbuch gab es zu diesem Zeitpunkt schon (v0.81, eigener Tab, acht
       Abschnitte, Hinweis nach einer Minute) -- er hat es nur nicht
       wahrgenommen, und DAS ist der Befund: eine Hilfe, die man finden muss,
       findet der nicht, der noch nicht weiß, dass er sie braucht. Deshalb kommt
       dieses Fenster von selbst, genau einmal, und schickt danach ins Handbuch
       weiter, statt dessen Inhalt zu wiederholen.

       Es ist eine eigene Ebene wie der Abspann und bewusst NICHT im .rahmen:
       das Regionen-Layout darf davon nichts merken (Prinzip 8). -->
  <div class="erstklaerung" id="erstklaerung" hidden></div>

  <!-- Das Einstellungsfenster (A-140, R-24). Hinter dem Zahnrad im Kopf, mit
       Esc zu schließen -- ein erweiterbarer Ort, kein Einzelzweck-Dialog: die
       Sprachwahl ist aus dem Kopf hierher gezogen, die Grundskalierung ist
       ihr erster eigener Bewohner, eine dritte Einstellung kommt später ohne
       Umbau dazu (eine Zeile mehr in dieser Liste).

       Dieselbe Bauform wie Abspann und Erstklärung: eine feste Ebene über
       allem, eine Tafel darin -- deshalb bewusst NICHT im .rahmen (Prinzip 8).
       Anders als dort bleibt der Inhalt hier aber STATISCH MARKUP statt per
       JS gebaut: nichts hier ist eine Liste, die pro Sprache oder Spielstand
       wechselt -- renderFesteTexte (js/ui.js) befüllt data-text/data-titel wie
       überall sonst im festen Kopf/Testmodus-Markup, ein zweiter Baumechanismus
       für eine Handvoll fester Zeilen wäre unnötig. -->
  <div class="einstellungen" id="einstellungen" hidden>
    <div class="einstellungen-tafel">
      <h2 data-text="Einstellungen"></h2>

      <div class="einstellungen-zeile">
        <span class="dezent" data-text="Sprache"></span>
        <!-- Dieselbe Leiste, derselbe Mechanismus (renderSprachwahl in
             js/ui.js), nur an ihrem neuen Ort -- die Funktion kennt ihr Ziel
             über die ID, nicht über den umgebenden Rahmen. -->
        <div class="kopf-sprache" id="sprach-leiste"></div>
      </div>

      <div class="einstellungen-zeile">
        <span class="dezent" data-text="Startschwierigkeit"></span>
        <!-- A-190. Wirkt NICHT auf die laufende Partie -- eine Startwahl ist
             keine laufende Einstellung, sondern gilt erst beim nächsten
             Neustart (renderStartschwierigkeit in js/ui.js). Dieselbe
             Leisten-Bauform wie die Sprachwahl, andere ID. -->
        <div class="kopf-sprache" id="schwierigkeit-leiste"></div>
      </div>

      <div class="einstellungen-zeile">
        <span class="dezent" data-text="Größe der Oberfläche"></span>
        <!-- A-140 (ehemals A-124). 70-100%: ein Faktor an der Wurzel
             (js/ui.js liest den Regler und setzt documentElement.style.
             fontSize), die rem-Schriftskala und alles in rem gemessene
             zieht mit. Bewusst als Regler wie das übrige Spiel
             (.schieber-gruppe, z.B. beim Tanken) und nicht als Texteingabe --
             der Effekt soll sich beim Ziehen sofort zeigen. -->
        <input type="range" class="einstellungen-regler" id="grundskalierung-regler"
               min="70" max="100" step="1"
               data-titel="Verkleinert die ganze Oberfläche zwischen 70 % und 100 % -- wirkt sofort. Praktisch bei wenig Bildschirmplatz, geht auf Kosten der Lesbarkeit." />
        <span class="einstellungen-wert" id="grundskalierung-wert"></span>
      </div>

      <div class="einstellungen-knoepfe">
        <button id="einstellungen-schliessen" data-text="Schließen"></button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js?v=0.9.1"></script>
</body>
</html>
